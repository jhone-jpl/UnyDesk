# Build UnyDesk Linux client (x64 Flutter + .deb)
#
# Trigger: alone or via "Build UnyDesk Clients"
# Artifacts: unydesk-linux-x64 (+ optional .deb)

name: Build UnyDesk Linux

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: unydesk-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.75"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  CLIENT_DIR: unydesk-client
  DEBIAN_FRONTEND: noninteractive

jobs:
  generate-bridge:
    name: Generate flutter-rust-bridge
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ${{ env.CLIENT_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require vendored hbb_common
        run: |
          if [ ! -f libs/hbb_common/src/config.rs ]; then
            echo "::error::libs/hbb_common missing from git (vendored UnyDesk tree required)"
            exit 1
          fi

      - name: Install prerequisites
        working-directory: ${{ github.workspace }}
        run: |
          set -eux
          # GHA runners often hold dpkg lock via unattended-upgrades → apt exit 100
          sudo apt-get -o DPkg::Lock::Timeout=300 update -y
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y \
            clang cmake curl gcc g++ git libclang-dev \
            libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.22.3"
          cache: true

      - name: Install codegen tools
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml || true
          cd flutter && flutter pub get

      - name: Generate bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
          sed -i "s/ffi.NativeFunction<ffi.Bool Function(DartPort/ffi.NativeFunction<ffi.Uint8 Function(DartPort/g" flutter/lib/generated_bridge.dart || true
          test -f src/bridge_generated.rs
          test -f flutter/lib/generated_bridge.dart

      - name: Upload bridge
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact-linux
          path: |
            ${{ env.CLIENT_DIR }}/src/bridge_generated.rs
            ${{ env.CLIENT_DIR }}/src/bridge_generated.io.rs
            ${{ env.CLIENT_DIR }}/flutter/lib/generated_bridge.dart
            ${{ env.CLIENT_DIR }}/flutter/lib/generated_bridge.freezed.dart
            ${{ env.CLIENT_DIR }}/flutter/macos/Runner/bridge_generated.h
            ${{ env.CLIENT_DIR }}/flutter/ios/Runner/bridge_generated.h
          if-no-files-found: error

  build-linux:
    name: Build Linux x64
    needs: [generate-bridge]
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: ${{ env.CLIENT_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space
        working-directory: ${{ github.workspace }}
        run: |
          set -eux
          sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet || true
          df -h

      - name: Install build dependencies
        working-directory: ${{ github.workspace }}
        run: |
          set -eux
          # Exit code 100 from apt is almost always lock or unmet deps — wait for lock.
          sudo apt-get -o DPkg::Lock::Timeout=300 update -y
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y \
            clang cmake curl g++ gcc git nasm ninja-build pkg-config wget \
            libgtk-3-dev libclang-dev llvm-dev \
            libayatana-appindicator3-dev libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libpam0g-dev libpulse-dev libva-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxdo-dev libxfixes-dev libssl-dev \
            python3 dpkg-dev

      - name: Set swap
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c
        with:
          swap-size-gb: 12

      - name: Require vendored hbb_common
        run: |
          if [ ! -f libs/hbb_common/src/config.rs ]; then
            echo "::error::libs/hbb_common missing from git (vendored UnyDesk tree required)"
            exit 1
          fi

      - name: Restore bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact-linux
          path: .

      - name: Verify bridge files
        run: |
          test -f src/bridge_generated.rs
          test -f flutter/lib/generated_bridge.dart
          ls -la src/bridge_generated* flutter/lib/generated_bridge* || true

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-linux-x64-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('unydesk-client/vcpkg.json', 'unydesk-client/res/vcpkg/**') }}
          restore-keys: |
            vcpkg-linux-x64-${{ env.VCPKG_COMMIT_ID }}-

      - name: Configure VCPKG_BINARY_SOURCES
        working-directory: ${{ github.workspace }}
        run: |
          CACHE_DIR="${GITHUB_WORKSPACE}/.vcpkg-cache"
          mkdir -p "$CACHE_DIR"
          echo "VCPKG_BINARY_SOURCES=clear;files,${CACHE_DIR},readwrite" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.CLIENT_DIR }} -> target
          prefix-key: ubuntu-22.04-unydesk

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Patch Flutter dropdown
        run: |
          patch_file=".github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          if [[ -f "$patch_file" ]]; then
            FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
            cp "$patch_file" "$FLUTTER_ROOT/"
            (cd "$FLUTTER_ROOT" && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff) || true
          fi

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          vcpkgJsonGlob: "unydesk-client/vcpkg.json"
          doNotCache: true

      - name: Install vcpkg packages
        run: |
          set -eux
          sudo apt-get -o DPkg::Lock::Timeout=300 remove -y libopus-dev || true
          if ! "$VCPKG_ROOT/vcpkg" install --triplet x64-linux --x-install-root="$VCPKG_ROOT/installed"; then
            echo "::error::vcpkg install failed — dumping recent logs"
            find "${VCPKG_ROOT}/buildtrees" -name "*.log" 2>/dev/null | tail -n 40 | while read -r f; do
              echo "===== $f ====="
              tail -n 80 "$f" || true
            done
            exit 1
          fi

      - name: Build UnyDesk (Flutter + deb)
        env:
          VCPKG_ROOT: /opt/vcpkg
        run: |
          set -eux
          sed -i 's/\["cdylib", "staticlib", "rlib"\]/["cdylib"]/g' Cargo.toml
          python3 ./build.py --flutter --hwcodec
          ls -lah .
          ls -lah flutter/build/linux/x64/release/bundle/
          ls -lah rustdesk-*.deb || true

      - name: Prepare bundle artifact
        working-directory: ${{ github.workspace }}
        run: |
          set -eux
          mkdir -p artifacts/unydesk-linux-x64
          cp -a unydesk-client/flutter/build/linux/x64/release/bundle/. artifacts/unydesk-linux-x64/
          if ls unydesk-client/rustdesk-*.deb 1>/dev/null 2>&1; then
            cp unydesk-client/rustdesk-*.deb artifacts/
            for f in artifacts/rustdesk-*.deb; do
              mv "$f" "${f/rustdesk-/unydesk-}"
            done
          fi
          ls -lah artifacts/unydesk-linux-x64 | head

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: unydesk-linux-x64
          path: artifacts/unydesk-linux-x64
          if-no-files-found: error

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: unydesk-linux-x64-deb
          path: artifacts/unydesk-*.deb
          if-no-files-found: warn

      - name: Failure hint
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          echo "::error::Linux build failed — open the first red step and copy the last 40 log lines."
          df -h || true
          free -m || true
