# Build UnyDesk Windows client (x64 Flutter)
#
# Trigger: Actions → "Build UnyDesk Windows" → Run workflow
# Artifact: unydesk-windows-x64
#
# Aligned with unydesk-client/.github/workflows/flutter-build.yml (x64 matrix),
# adapted for monorepo layout (unydesk-client/).

name: Build UnyDesk Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "unydesk-client/**"
      - ".github/workflows/build-unydesk-windows.yml"

concurrency:
  group: unydesk-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match RustDesk 1.4.9 flutter-build.yml
  RUST_VERSION: "1.75"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  CLIENT_DIR: unydesk-client

jobs:
  generate-bridge:
    name: Generate flutter-rust-bridge
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ${{ env.CLIENT_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require vendored hbb_common
        run: |
          if [ ! -f libs/hbb_common/src/config.rs ]; then
            echo "::error::libs/hbb_common missing from git (do not clone latest — breaks 1.4.9 + UnyDesk branding)"
            exit 1
          fi
          grep -q 'UnyDesk' libs/hbb_common/src/config.rs

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc g++ git libclang-dev \
            libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.22.3"
          cache: true

      - name: Install codegen tools
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml || true
          cd flutter && flutter pub get

      - name: Generate bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
          sed -i "s/ffi.NativeFunction<ffi.Bool Function(DartPort/ffi.NativeFunction<ffi.Uint8 Function(DartPort/g" flutter/lib/generated_bridge.dart || true
          test -f src/bridge_generated.rs
          test -f flutter/lib/generated_bridge.dart
          ls -la src/bridge_generated* flutter/lib/generated_bridge* || true

      - name: Upload bridge
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ${{ env.CLIENT_DIR }}/src/bridge_generated.rs
            ${{ env.CLIENT_DIR }}/src/bridge_generated.io.rs
            ${{ env.CLIENT_DIR }}/flutter/lib/generated_bridge.dart
            ${{ env.CLIENT_DIR }}/flutter/lib/generated_bridge.freezed.dart
            ${{ env.CLIENT_DIR }}/flutter/macos/Runner/bridge_generated.h
            ${{ env.CLIENT_DIR }}/flutter/ios/Runner/bridge_generated.h
          if-no-files-found: error

  build-topmost-dll:
    name: Build WindowInjection.dll
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Clone and build RustDeskTempTopMostWindow
        shell: cmd
        run: |
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow
          cd RustDeskTempTopMostWindow
          git checkout ecd8d6a139eee76845ea66423fb739af450fda90
          msbuild WindowInjection\WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: topmostwindow-artifacts-x64
          path: RustDeskTempTopMostWindow/WindowInjection/x64/Release/WindowInjection.dll
          if-no-files-found: warn

  build-windows:
    name: Build Windows x64
    needs: [generate-bridge, build-topmost-dll]
    if: ${{ always() && needs.generate-bridge.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        working-directory: ${{ env.CLIENT_DIR }}
    steps:
      - name: Free disk space
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          # Windows runners fill up during vcpkg+ffmpeg+cargo (~40–60+ min).
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue @(
            "C:\Program Files\dotnet",
            "C:\Program Files (x86)\Android",
            "C:\Program Files\Android",
            "C:\Android",
            "C:\hostedtoolcache\windows\CodeQL",
            "C:\hostedtoolcache\windows\Python\3.6*",
            "C:\hostedtoolcache\windows\Python\3.7*",
            "C:\hostedtoolcache\windows\Python\3.8*"
          )
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      - name: Checkout
        uses: actions/checkout@v5

      - name: Require vendored hbb_common
        shell: bash
        run: |
          if [ ! -f libs/hbb_common/src/config.rs ]; then
            echo "::error::libs/hbb_common missing from git"
            exit 1
          fi

      - name: Restore bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: .

      - name: Verify bridge files
        shell: bash
        run: |
          test -f src/bridge_generated.rs
          test -f flutter/lib/generated_bridge.dart
          ls -la src/bridge_generated* flutter/lib/generated_bridge* || true

      - name: Restore vcpkg binary cache (files)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-win-x64-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('unydesk-client/vcpkg.json', 'unydesk-client/res/vcpkg/**') }}
          restore-keys: |
            vcpkg-win-x64-${{ env.VCPKG_COMMIT_ID }}-

      - name: Configure VCPKG_BINARY_SOURCES
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          # NEVER use x-gha (removed / returns 400 on current Actions Cache API).
          # Normalize path to forward slashes — backslashes break vcpkg on Windows.
          CACHE_DIR="${GITHUB_WORKSPACE}/.vcpkg-cache"
          mkdir -p "$CACHE_DIR"
          CACHE_DIR="${CACHE_DIR//\\//}"
          echo "VCPKG_BINARY_SOURCES=clear;files,${CACHE_DIR},readwrite" >> "$GITHUB_ENV"
          echo "Using VCPKG_BINARY_SOURCES=clear;files,${CACHE_DIR},readwrite"

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Custom Flutter engine (RustDesk)
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $candidates = @(
            "C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release",
            "$env:FLUTTER_ROOT/bin/cache/artifacts/engine/windows-x64-release"
          )
          $engine = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $engine) { throw "Flutter windows-x64-release engine dir not found" }
          Move-Item -Force windows-x64-release/* $engine/
          Write-Host "Installed custom engine into $engine"

      - name: Patch Flutter dropdown
        shell: bash
        run: |
          patch_file=".github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          if [[ -f "$patch_file" ]]; then
            FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
            cp "$patch_file" "$FLUTTER_ROOT/"
            cd "$FLUTTER_ROOT"
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff || true
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.CLIENT_DIR }} -> target
          prefix-key: windows-2022-unydesk

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          vcpkgJsonGlob: "unydesk-client/vcpkg.json"
          doNotCache: true

      - name: Install vcpkg packages
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          echo "VCPKG_ROOT=$VCPKG_ROOT"
          echo "VCPKG_BINARY_SOURCES=$VCPKG_BINARY_SOURCES"
          clang --version || true
          if ! "$VCPKG_ROOT/vcpkg" install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            echo "::error::vcpkg install failed"
            find "$VCPKG_ROOT/buildtrees" -name "*.log" 2>/dev/null | tail -n 50 | while read -r f; do
              echo "===== $f ====="
              tail -n 100 "$f" || true
            done
            exit 1
          fi
          head -n 80 "$VCPKG_ROOT/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true

      - name: Build UnyDesk (Flutter)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          if ($LASTEXITCODE -ne 0) { throw "build.py failed with exit $LASTEXITCODE" }
          if (Test-Path .\flutter\build\windows\x64\runner\Release) {
            Move-Item -Force .\flutter\build\windows\x64\runner\Release .\unydesk
          } elseif (Test-Path .\flutter\build\windows\runner\Release) {
            Move-Item -Force .\flutter\build\windows\runner\Release .\unydesk
          } else {
            Get-ChildItem -Recurse .\flutter\build\windows -ErrorAction SilentlyContinue | Select-Object -First 80 FullName
            throw "Flutter Windows Release output not found"
          }
          Get-ChildItem .\unydesk | Select-Object Name, Length

      - name: Add usbmmidd helper
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse -ErrorAction SilentlyContinue
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe","usbmmidd_v2\deviceinstaller.exe","usbmmidd_v2\usbmmidd.bat" -ErrorAction SilentlyContinue
          Move-Item -Force .\usbmmidd_v2 .\unydesk\

      - name: Download WindowInjection.dll
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: topmostwindow-artifacts-x64
          path: ${{ env.CLIENT_DIR }}/unydesk

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: unydesk-windows-x64
          path: ${{ env.CLIENT_DIR }}/unydesk
          if-no-files-found: error
